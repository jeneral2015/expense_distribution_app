name: expense_distribution_app
description: A Flutter application for expense distribution.
version: 2.1.0+2
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  sqflite: ^2.3.3+1
  sqflite_common_ffi_web: ^0.4.5+4
  sqflite_common_ffi: ^2.3.2
  window_manager: ^0.3.9
  path: ^1.9.0
  logging: ^1.2.0
  go_router: ^16.2.1
  intl: ^0.20.2
  file_picker: ^10.2.0
  path_provider: ^2.1.4
  archive: ^3.6.1
  share_plus: ^12.0.2
  syncfusion_flutter_xlsio: ^29.2.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/1.ttf
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/1.ttf
